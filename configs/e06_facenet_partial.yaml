name: e06_facenet_partial
hypothesis: >
  Fine-tuning PARCIAL (só os últimos blocos) do modelo pré-treinado, com a melhor loss de métrica
  entre E03-E05, melhora o E01 sem destruir o que a rede já sabe. Ajuste `loss` após ver E03-E05.
data: {image_size: 160}
model: {type: facenet, pretrained: vggface2, finetune: partial}
loss: {type: triplet, margin: 0.2}
train: {epochs: 10, lr: 0.0001, P: 12, K: 4, steps_per_epoch: 60}
