name: e07_facenet_full
hypothesis: >
  Fine-tuning COMPLETO custa mais e, com poucos dados, pode piorar o E01/E06 por esquecimento e
  overfitting. Ajuste `loss` para a mesma usada em E06 para a comparação ser justa.
data: {image_size: 160}
model: {type: facenet, pretrained: vggface2, finetune: full}
loss: {type: triplet, margin: 0.2}
train: {epochs: 10, lr: 0.00003, P: 12, K: 4, steps_per_epoch: 60}
